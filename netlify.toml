# Netlify deploy configuration.
#
# Netlify rather than Vercel deliberately: Vercel's free Hobby tier prohibits
# commercial use, and this is a revenue-generating store. Netlify's free tier
# permits it explicitly and has first-class Next.js support.

[build]
  # Deploys must be built by Netlify CI, not locally.
  #
  # `netlify deploy --build` from the Windows dev machine fails while bundling
  # the edge middleware: the plugin cannot resolve middleware.js's sibling
  # runtime file, and the error path is visibly malformed —
  #   file:///Shivalika%20Website/C:/Shivalika%20Website/.netlify/...
  # a doubled path caused by the space in the project directory name. It fails
  # the same way under both Turbopack and webpack, so it is a path-handling
  # problem in the local build, not a bundler limitation.
  #
  # Building on Netlify's Linux runners avoids it entirely, and is the right
  # setup regardless: shipping from a developer's laptop is not reproducible.
  #
  # `npm run build` is "next build --webpack"; `npm run build:turbo` is the
  # Next 16 default. Webpack is kept as the conservative choice until a green
  # CI build proves Turbopack works here too.
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Nightly maintenance runs from netlify/functions/cron-maintenance.mjs, which
# declares its own schedule via the exported `config`. Declaring it here as well
# would be a second source of truth, so it deliberately is not repeated.
#
# The function is a shim: Netlify's scheduler can only invoke a Netlify Function,
# not a Next.js route handler, so it calls /api/cron with the shared secret.

# Security headers are also set in next.config.ts; these apply to static assets
# that bypass the Next.js runtime.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/review/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
