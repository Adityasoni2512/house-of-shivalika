# Netlify deploy configuration.
#
# Netlify rather than Vercel deliberately: Vercel's free Hobby tier prohibits
# commercial use, and this is a revenue-generating store. Netlify's free tier
# permits it explicitly and has first-class Next.js support.

[build]
  # Deploys must be built by Netlify CI. `netlify deploy --build` does not work
  # from a Windows machine.
  #
  # It fails while bundling the edge middleware with:
  #   Cannot find module './webpack-runtime.js'   (or './chunks/[turbopack]_runtime.js')
  # @netlify/plugin-nextjs copies middleware.js into the edge-function bundle
  # but not the sibling runtime chunk it requires.
  #
  # Tested and ruled out:
  #   - bundler choice — fails identically under Turbopack and webpack
  #   - the space in "C:\Shivalika Website" — fails the same in a space-free path
  # It reproduces on Windows regardless. Netlify's Linux runners build it in
  # ~75s without complaint, which is the right setup anyway: shipping from a
  # developer's laptop is not reproducible.
  #
  # `npm run build` is "next build --webpack"; `npm run build:turbo` is the
  # Next 16 default. Webpack is kept only as the conservative choice — a green
  # CI build on Turbopack would be reason to drop the flag.
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Nightly maintenance runs from netlify/functions/cron-maintenance.mjs, which
# declares its own schedule via the exported `config`. Declaring it here as well
# would be a second source of truth, so it deliberately is not repeated.
#
# The function is a shim: Netlify's scheduler can only invoke a Netlify Function,
# not a Next.js route handler, so it calls /api/cron with the shared secret.

# Security headers are also set in next.config.ts; these apply to static assets
# that bypass the Next.js runtime.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/review/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
